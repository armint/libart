stages:
  - build

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# Builds the art-core static library target, the same one downstream
# projects consume via add_subdirectory(). This still configures and
# fetches tests/ too (CMakeLists.txt adds it whenever not cross-compiling),
# just doesn't build the test binary — the test job below does that.
build:
  stage: build
  variables:
    GIT_DEPTH: 0
  script:
    - cmake -B build -G "Unix Makefiles" -D CMAKE_BUILD_TYPE=Release
    - cmake --build build --target art-core -j$(nproc)

# Builds and runs the native unit test suite (doctest; a handful of
# storage/ tests use Catch2-style TEST_CASE/CHECK/SUBCASE macros, which
# doctest supports with the same names/semantics).
#
# Four binaries, same sources: libArT-tests builds without LIBART_ENABLE_64BIT
# (big_int_t/big_uint_t = int32_t/uint32_t) or PRINTF_ENABLE_FLOATING_POINT,
# matching what art-core ships by default; libArT-tests-64bit defines
# LIBART_ENABLE_64BIT (big_int_t/big_uint_t = int64_t/uint64_t), so the
# ll-sized tfp_printf paths and other big_*_t users are exercised too;
# libArT-tests-float and libArT-tests-float-64bit define
# PRINTF_ENABLE_FLOATING_POINT for each width, so tfp_printf's %f/%F path —
# also opt-in, undefined by default — gets run at both widths (including the
# width-dependent overflow boundary at 2^32 vs 2^64) instead of staying
# untested dead code, without giving up CI coverage of the float-disabled
# default on either integer width.
test:
  stage: build
  variables:
    GIT_DEPTH: 0
  script:
    - cmake -B build -G "Unix Makefiles" -D CMAKE_BUILD_TYPE=Debug
    - cmake --build build --target libArT-tests libArT-tests-64bit libArT-tests-float libArT-tests-float-64bit -j$(nproc)
    # doctest writes every active reporter's output to the same --out file,
    # which corrupts the XML if the console reporter is also active; run
    # twice instead — console output determines job pass/fail, the second
    # run just produces the JUnit artifact for the MR widget.
    - ./build/tests/libArT-tests
    - ./build/tests/libArT-tests --reporters=junit --out=build/junit.xml
    - ./build/tests/libArT-tests-64bit
    - ./build/tests/libArT-tests-64bit --reporters=junit --out=build/junit-64bit.xml
    - ./build/tests/libArT-tests-float
    - ./build/tests/libArT-tests-float --reporters=junit --out=build/junit-float.xml
    - ./build/tests/libArT-tests-float-64bit
    - ./build/tests/libArT-tests-float-64bit --reporters=junit --out=build/junit-float-64bit.xml
  artifacts:
    when: always
    reports:
      junit:
        - build/junit.xml
        - build/junit-64bit.xml
        - build/junit-float.xml
        - build/junit-float-64bit.xml

# Build acceptance criteria of the LittleFS binding. art-core must stay free of littlefs whether or not the
# optional art-storage-littlefs target is enabled, and that target must build. It builds natively against the
# FreeRTOS host stubs of the unit tests; a cross build of it needs a FreeRTOS target from a superproject
# (sentinode-ht), which this image does not have, so that is covered there.
littlefs:
  stage: build
  variables:
    GIT_DEPTH: 0
  script:
    # Default (option off): no binding target, no littlefs symbols in art-core.
    - cmake -B build-default -G "Unix Makefiles" -D CMAKE_BUILD_TYPE=Release
    - cmake --build build-default --target art-core -j$(nproc)
    - '! cmake --build build-default --target help | grep -q art-storage-littlefs'
    - '! nm build-default/libart-core.a | grep -Eq "lfs_|LittleFs"'
    # Option on: the target builds, and art-core still contains no littlefs code.
    - cmake -B build-littlefs -G "Unix Makefiles" -D CMAKE_BUILD_TYPE=Release -D ART_STORAGE_LITTLEFS=ON
    - cmake --build build-littlefs --target art-storage-littlefs art-core -j$(nproc)
    - '! nm build-littlefs/libart-core.a | grep -Eq "lfs_|LittleFs"'
    - nm build-littlefs/libart-storage-littlefs.a | grep -q LittleFsFileSystemBase
